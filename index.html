<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مافيا">
<meta name="theme-color" content="#0e1226">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>مافيا</title>
<style>
:root{--ink:#0e1226;--panel:#1a1f3d;--line:#323a6e;--text:#efe6d2;--dim:#a2a5c6;--red:#d1344a;--brass:#d9a441;--ok:#5fc9a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;font-family:"Tajawal","Geeza Pro","Segoe UI",Tahoma,sans-serif;font-size:17px;color:var(--text);background-color:var(--ink);background-attachment:fixed;background-repeat:no-repeat;-webkit-user-select:none;user-select:none;padding:env(safe-area-inset-top) 16px 0;
 background-image:radial-gradient(circle at 88% -4%,rgba(217,164,65,.30) 0,transparent 36%),radial-gradient(1.5px 1.5px at 12% 14%,#fff9 50%,transparent 52%),radial-gradient(1px 1px at 30% 8%,#fff8 50%,transparent 52%),radial-gradient(1.5px 1.5px at 55% 20%,#fff7 50%,transparent 52%),radial-gradient(1px 1px at 72% 12%,#fff8 50%,transparent 52%),radial-gradient(1px 1px at 40% 30%,#fff6 50%,transparent 52%),linear-gradient(180deg,#0e1226,#171c3b)}
body[data-ph=day]{background-color:#2b2a52;background-image:radial-gradient(circle at 15% 105%,rgba(255,196,120,.45) 0,transparent 45%),linear-gradient(180deg,#2b2a52,#6f4a64 75%,#b97a5e)}
body[data-ph=end]{background-image:radial-gradient(circle at 50% -10%,rgba(217,164,65,.38) 0,transparent 50%),linear-gradient(180deg,#0e1226,#1b1636)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:22px 0 calc(18px + env(safe-area-inset-bottom))}
h1,h2,.big,.n{font-family:"Reem Kufi","Tajawal","Geeza Pro",sans-serif;font-weight:700}
h1{font-size:44px;line-height:1.1;margin:6px 0 2px;color:var(--brass);display:flex;align-items:center;gap:10px}
h1 svg{width:42px;height:42px;flex:none}
h2{font-size:25px;margin:14px 0 8px}
p{line-height:1.8;color:var(--dim);margin:4px 0 12px}
.big{font-size:56px;line-height:1.2;margin:14px 0 6px;color:var(--brass);word-break:break-word}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(14,18,38,.7);color:var(--text);-webkit-user-select:text;user-select:text}
input:focus{outline:2px solid var(--brass);outline-offset:1px}
button{font:inherit;font-weight:700;font-size:17px;padding:13px 18px;border:1.5px solid var(--line);border-radius:14px;background:rgba(26,31,61,.85);color:var(--text);cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible,.pl:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.gold{background:var(--brass);border-color:var(--brass);color:var(--ink)}
button.main{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));width:100%;margin-top:16px;padding:17px;font-size:19px;background:var(--brass);border-color:var(--brass);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.4)}
button.sec{width:100%;margin-top:8px}
button:disabled{opacity:.35;box-shadow:none}
.list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.pl{display:flex;align-items:center;gap:12px;background:rgba(26,31,61,.85);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:18px;cursor:pointer;position:relative}
.pl>span:last-child,.pl>.cnt,.pl>small,.pl>b,.pl>button{margin-inline-start:auto}
.pl.sel{border-color:var(--brass);background:rgba(217,164,65,.16)}
.pl.sel::after{content:"✓";position:absolute;inset-inline-end:14px;color:var(--brass);font-weight:800}
.pl.dead{opacity:.45;text-decoration:line-through}
.pl button{padding:6px 12px;font-size:15px}
.av{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--line);color:var(--brass);display:grid;place-items:center;font-weight:800;flex:none}
.cnt{display:flex;align-items:center;gap:12px}
.cnt b{min-width:26px;text-align:center;font-size:22px;color:var(--brass)}
.cnt button{width:40px;height:40px;padding:0;font-size:22px}
.tag{align-self:flex-start;display:inline-block;border:1px solid var(--brass);color:var(--brass);padding:3px 12px;border-radius:99px;font-size:14px;margin-bottom:6px}
.sp{flex:1;min-height:12px}
.role{border:2px solid var(--brass);border-radius:26px;padding:30px 20px;text-align:center;margin:14px 0;box-shadow:0 0 40px rgba(217,164,65,.22),inset 0 0 0 5px rgba(0,0,0,.18);animation:flip .5s ease-out}
.role .e{font-size:68px;line-height:1}
.role .n{font-size:38px;margin:10px 0 4px}
.role p{color:var(--text);opacity:.88;margin:6px 0 0}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.role{animation:none}}
.mafia{background:linear-gradient(160deg,#6b1626,#2a0a12)}.godfather{background:linear-gradient(160deg,#4d1020,#1c0710)}
.citizen{background:linear-gradient(160deg,#1f4a3d,#0d2a22)}.doctor{background:linear-gradient(160deg,#17506a,#0b2733)}
.detective{background:linear-gradient(160deg,#5e4716,#2b200a)}.sniper{background:linear-gradient(160deg,#4a2f7a,#1d1236)}
.bodyguard{background:linear-gradient(160deg,#1d447a,#0c1d38)}.jester{background:linear-gradient(160deg,#7a2f78,#2e1030)}
.res{font-size:26px;font-weight:700;text-align:center;margin:18px 0;padding:20px 14px;border-radius:18px;background:rgba(14,18,38,.55);border:1px solid var(--line);line-height:1.7}
.bad{color:#ff7a8a}.good{color:var(--ok)}
small{color:var(--dim)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#app{position:relative;z-index:1}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 8% 22%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 24% 12%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 46% 8%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 63% 26%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 81% 14%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 92% 34%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 36% 40%,#fff 50%,transparent 52%);animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.moon{position:absolute;left:24px;top:calc(26px + env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;box-shadow:inset -15px 5px 0 0 var(--brass);filter:drop-shadow(0 0 14px rgba(217,164,65,.65));animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(10px) rotate(-8deg)}}
.sun{position:absolute;left:50%;bottom:-90px;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,#ffe2ae 0,#f4a96a 45%,rgba(244,169,106,0) 70%);animation:sunrise 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunrise{from{transform:translateY(160px);opacity:0}to{transform:none;opacity:1}}
body[data-ph=day] .moon,body[data-ph=day] .stars{display:none}
body:not([data-ph=day]) .sun{display:none}
#cf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 3.6s linear infinite}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
.in>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(n+2){animation-delay:.05s}.in>*:nth-child(n+4){animation-delay:.1s}.in>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pl{transition:transform .12s,border-color .15s,background .15s}.pl:active{transform:scale(.98)}
.pl.sel{animation:pop .25s}@keyframes pop{50%{transform:scale(1.035)}}
.vr{background:rgba(14,18,38,.6);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vh{display:flex;align-items:center;gap:12px;font-size:18px}.vh b{margin-inline-start:auto;font-size:26px;color:var(--brass)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--brass),var(--red));animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.vw{font-size:15px;color:var(--dim);line-height:1.6}
.rs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ch{border:1px solid var(--line);background:rgba(14,18,38,.55);border-radius:99px;padding:5px 12px;font-size:15px}
.ch.dead{opacity:.6;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#mn{display:none;position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top));right:12px;padding:7px 14px;font-size:14px;border-radius:99px;background:rgba(14,18,38,.8);backdrop-filter:blur(6px)}
body[data-ph=night] #mn,body[data-ph=day] #mn,body[data-ph=end] #mn{display:block}
body[data-ph=night] #app,body[data-ph=day] #app,body[data-ph=end] #app{padding-top:62px}
</style>

<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="sky"><div class="stars"></div><div class="moon"></div><div class="sun"></div><div id="cf"></div></div>
<button id="mn" onclick="goMenu()">☰ القائمة</button>
<div id="app"></div>
<script>
const R={
 mafia:{n:'مافيا',e:'🔪',m:1,d:'في كل ليلة تتفق مع باقي المافيا على قتل لاعب. تفوز المافيا عندما يتساوى عددها مع عدد الباقين.'},
 godfather:{n:'Mafia Boss',e:'🎩',m:1,d:'زعيم المافيا. إذا اختلفت المافيا في اختيار الضحية فقرارك هو الحاسم. ويظهر للمحقق كأنه بريء.'},
 citizen:{n:'مواطن',e:'🏠',d:'لا قدرة خاصة لك. ناقش وصوّت لكشف المافيا.'},
 doctor:{n:'طبيب',e:'💉',d:'كل ليلة تحمي لاعبًا من القتل (يمكنك حماية نفسك).'},
 detective:{n:'محقق',e:'🔍',d:'كل ليلة تتحقق من لاعب: هل هو مافيا أم لا؟'},
 sniper:{n:'القناص',e:'🎯',d:'لديك رصاصة واحدة طوال اللعبة. تطلقها في أي ليلة على من تشاء، أو تحتفظ بها.'},
 bodyguard:{n:'الحارس',e:'🛡️',d:'كل ليلة تحرس لاعبًا. إن هاجمته المافيا تموت أنت بدلًا منه وينجو هو.'},
 spy:{n:'الجاسوس',e:'🕵️',d:'كل ليلة تختار لاعبًا ثم تقرّر: تتجسس عليه فتعرف دوره بالضبط، أو تقتله (مرة واحدة فقط). احذر: المافيا تستطيع تخمين من هو الجاسوس، وإن أصابوا تموت فورًا.'},
 jester:{n:'المهرّج',e:'🤡',d:'هدفك أن يقصيك الجميع بالتصويت. إن أُقصيت بالتصويت تفوز وحدك.'}
};
const SPECIAL=['godfather','sniper','spy','bodyguard','jester'];
const $=document.getElementById('app');
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
let S={names:ld('names','[]'),opt:ld('opt','{}')};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=n=>`<i class="av">${esc([...n][0]||'?')}</i>`;
const roster=()=>`<div class="rs">${S.p.map(x=>`<span class="ch ${x.alive?'':'dead'}">${x.alive?'':'💀 '}${esc(x.name)}${x.rev?' ('+R[x.role].e+' '+R[x.role].n+')':''}</span>`).join('')}</div>`;
const alive=()=>S.p.filter(x=>x.alive);
const isM=p=>!!R[p.role].m;
const holder=r=>S.p.find(x=>x.role===r&&x.alive);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{try{localStorage.setItem('names',JSON.stringify(S.names));localStorage.setItem('opt',JSON.stringify(S.opt))}catch(e){}};

function setup(){
 $.innerHTML=`<h1><svg viewBox="0 0 48 48"><path d="M30 6a18 18 0 1 0 12 30A15 15 0 0 1 30 6z" fill="#d9a441"/><circle cx="36" cy="14" r="2.5" fill="#d1344a"/></svg>مافيا</h1><p>لعبة جماعية بهاتف واحد. أضف اللاعبين (4 على الأقل).</p>
 <div class="row"><input id="nm" placeholder="اسم اللاعب" maxlength="14"><button class="gold" onclick="add()">إضافة</button></div>
 <div class="list">${S.names.map((n,i)=>`<div class="pl">${av(n)}${esc(n)}<button onclick="rm(${i})">حذف</button></div>`).join('')}</div>
 <h2>الإعدادات</h2><div class="list"><div class="pl">عدد المافيا<div class="cnt"><button onclick="cm(-1)">−</button><b>${mc()}</b><button onclick="cm(1)">+</button></div></div></div><h2>أدوار إضافية</h2><div class="list">${SPECIAL.map(k=>`<div class="pl ${S.opt[k]?'sel':''}" onclick="tg('${k}')"><span style="font-size:26px">${R[k].e}</span><span>${R[k].n}</span></div>`).join('')}</div>
 <div class="sp"></div>
 <button class="main" ${S.names.length<4?'disabled':''} onclick="start()">ابدأ اللعبة (${S.names.length})</button>`;
 document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
}
const auto=n=>Math.max(1,Math.round(n/4)),maxM=n=>Math.max(1,Math.floor((n-1)/2));
function mc(){const n=S.names.length;return Math.min(S.mc||auto(n),maxM(n))}
function cm(d){S.mc=Math.max(1,Math.min(maxM(S.names.length),mc()+d));setup()}
function tg(k){S.opt[k]=!S.opt[k];save();setup()}
function add(){const i=document.getElementById('nm'),v=i.value.trim();if(!v)return;if(S.names.includes(v)){i.value='';return}S.names.push(v);save();setup();document.getElementById('nm').focus()}
function rm(i){S.names.splice(i,1);save();setup()}

function start(){
 const n=S.names.length,m=mc();
 let roles=Array(m).fill('mafia');
 if(S.opt.godfather)roles[0]='godfather';
 roles.push('doctor','detective');
 ['sniper','spy','bodyguard','jester'].forEach(k=>{if(S.opt[k])roles.push(k)});
 roles=roles.slice(0,n);
 while(roles.length<n)roles.push('citizen');
 shuffle(roles);
 S.p=S.names.map((name,i)=>({name,role:roles[i],alive:true}));
 S.i=0;S.night=1;S.bullet=true;S.sb=true;S.gb=true;reveal(false);
}
function reveal(show){
 const p=S.p[S.i];
 if(!show){
  $.innerHTML=`<span class="tag">توزيع الأدوار ${S.i+1}/${S.p.length}</span><h2>مرّر الهاتف إلى</h2><div class="big">${esc(p.name)}</div><p>لا ينظر أحد غيره إلى الشاشة.</p><div class="sp"></div><button class="main" onclick="reveal(true)">أنا ${esc(p.name)}، أظهر دوري</button>`;
 }else{
  const r=R[p.role];let extra='';
  if(isM(p)){const o=S.p.filter(x=>isM(x)&&x!==p).map(x=>esc(x.name));extra=o.length?`<p>زملاؤك في المافيا: <b>${o.join('، ')}</b></p>`:'<p>أنت وحدك في المافيا.</p>'}
  $.innerHTML=`<span class="tag">${esc(p.name)}</span><div class="role ${p.role}"><div class="e">${r.e}</div><div class="n">${r.n}</div><p>${r.d}</p>${extra}</div><div class="sp"></div><button class="main" onclick="nextReveal()">إخفاء وتمرير الهاتف</button>`;
 }
}
function nextReveal(){S.i++;if(S.i>=S.p.length)return nightIntro();reveal(false)}

function nightIntro(){
 S.act={};S.maf={};S.mp={};S.k=0;S.order=alive().map(x=>S.p.indexOf(x));
 $.innerHTML=`<span class="tag">الليلة ${S.night}</span><div class="big">الليل 🌙</div><p>مرّر الهاتف على كل لاعب حي بالترتيب. كل واحد يختار سرًا، حتى من لا قدرة له، فلا يعرف أحد من يفعل ماذا.</p><div class="sp"></div><button class="main" onclick="nt(0)">ابدأ</button>`;
}
const PR={spy:'اختر لاعبًا ثم قرّر: تجسّس أو اقتل',mafia:'اختر ضحية الليلة',godfather:'اختر ضحية الليلة',doctor:'اختر من تحميه الليلة',detective:'اختر من تتحقق منه',sniper:'اختر هدفك، أو احتفظ برصاصتك',bodyguard:'اختر من تحرسه',citizen:'لا قدرة لك الليلة. اختر أي لاعب حتى لا يعرف أحد دورك.',jester:'لا قدرة لك الليلة. اختر أي لاعب حتى لا يعرف أحد دورك.'};
function nt(m,res){
 const i=S.order[S.k];
 if(i===undefined){
  const e=Object.entries(S.maf);
  if(e.length){const mx=Math.max(...e.map(x=>x[1])),top=e.filter(x=>x[1]===mx);const bs=holder('godfather'),bp=bs?String(S.mp[S.p.indexOf(bs)]):null;const kk=top.length>1&&bp!==null&&top.some(x=>x[0]===bp)?bp:top[Math.floor(Math.random()*top.length)][0];S.act.mafia=kk==='none'?null:S.p[+kk]}
  return morning();
 }
 const p=S.p[i],r=R[p.role];
 if(m===0){
  $.innerHTML=`<span class="tag">الليلة ${S.night}</span><h2>مرّر الهاتف إلى</h2><div class="big">${esc(p.name)}</div><div class="sp"></div><button class="main" onclick="nt(1)">أنا ${esc(p.name)}</button>`;return;
 }
 if(m===2){
  $.innerHTML=`<span class="tag">${r.e} ${esc(p.name)}</span><h2>نتيجة التحقيق</h2><div class="res">${esc(res.name)}<br>${res.msg?`<span>${res.msg}</span>`:res.role?`<span class="good">${R[res.role].e} ${R[res.role].n}</span>`:`<span class="${res.m?'bad':'good'}">${res.m?'مافيا 🔪':'ليس مافيا ✅'}</span>`}</div>${res.caught?'<p class="bad" style="text-align:center">⚠️ المافيا اكتشفوك! ستموت في الصباح.</p>':''}<div class="sp"></div><button class="main" onclick="S.k++;nt(0)">إخفاء ومرّر الهاتف</button>`;return;
 }
 S.sel=null;
 let tm='';if(isM(p)){const o=S.p.filter(x=>isM(x)&&x!==p&&x.alive).map(x=>esc(x.name));if(o.length)tm=`<p>زملاؤك: <b>${o.join('، ')}</b></p>`;const pk=Object.entries(S.mp).map(([k,v])=>`${esc(S.p[k].name)} ← ${v==='none'?'لا أحد':esc(S.p[v].name)}`);if(pk.length)tm+=`<p>اختاروا حتى الآن: <b>${pk.join('، ')}</b></p>`;if(S.p.some(x=>x.role==='godfather'&&x.alive))tm+=`<p>عند الاختلاف يحسم Mafia Boss.</p>`}
 const sk=(p.role==='sniper'&&S.bullet)||isM(p);
 $.innerHTML=`<span class="tag">${r.e} ${r.n}</span><h2>${esc(p.name)}</h2><p>${PR[p.role]}</p>${tm}<div class="list" id="pk">${alive().filter(x=>!(isM(p)&&isM(x))).map(x=>`<div class="pl" onclick="pick(${S.p.indexOf(x)},this)">${av(x.name)}${esc(x.name)}${isM(p)&&Object.values(S.mp).includes(S.p.indexOf(x))?'<small>🔪 اختاره زميلك</small>':''}</div>`).join('')}</div><div class="sp"></div>${p.role==='spy'?`<button class="main" id="ok" disabled onclick="nd(0,'spy')">🔎 تجسّس</button>${S.sb?`<button class="sec" id="ok2" disabled onclick="nd(0,'kill')">🔪 اقتل (مرة واحدة)</button>`:''}`:`<button class="main" id="ok" disabled onclick="nd()">${isM(p)?'🔪 قتل':'تأكيد'}</button>`}${sk?`<button class="sec" onclick="nd(1)">${isM(p)?'لا نقتل أحدًا الليلة':'لا أطلق الليلة'}</button>`:''}${isM(p)&&S.gb&&S.p.some(x=>x.role==='spy')?`<button class="sec" id="ok2" disabled onclick="nd(0,'guess')">🕵️ أظن أنه الجاسوس (مرة واحدة في اللعبة)</button>`:''}`;
}
function pick(i,el){S.sel=i;document.querySelectorAll('#pk .pl').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');document.getElementById('ok').disabled=false;const o2=document.getElementById('ok2');if(o2)o2.disabled=false}
function nd(skip,mode){
 const p=S.p[S.order[S.k]],t=skip?null:S.p[S.sel];
 if(p.role==='spy'&&t){if(mode==='kill'){S.sb=false;S.act.spy=t}else return nt(2,{name:t.name,role:t.role})}
 if(isM(p)&&mode==='guess'&&t){S.gb=false;const hit=t.role==='spy';if(hit)S.act.spyHit=t;return nt(2,{name:t.name,msg:hit?'🕵️ أصبت! هو الجاسوس وسيموت':'ليس الجاسوس ❌'})}
 if(isM(p)){const j=t?S.p.indexOf(t):'none';S.maf[j]=(S.maf[j]||0)+1;S.mp[S.order[S.k]]=j}
 else if(['doctor','bodyguard','sniper'].includes(p.role))S.act[p.role]=t;
 if(p.role==='detective'&&t)return nt(2,{name:t.name,m:t.role==='mafia'});
 S.k++;nt(0);
}
function morning(){
 const A=S.act,dead=[],kill=p=>{if(p&&p.alive){p.alive=false;dead.push(p)}};
 const doc=holder('doctor'),bg=holder('bodyguard'),sn=holder('sniper'),sp=holder('spy'),mf=S.p.some(x=>isM(x)&&x.alive);
 const t=A.mafia;
 if(t&&mf){
  if(doc&&A.doctor===t){}
  else if(bg&&A.bodyguard===t&&bg!==t)kill(bg);
  else kill(t);
 }
 if(sn&&S.bullet&&A.sniper){S.bullet=false;kill(A.sniper)}
 if(sp&&A.spy)kill(A.spy);
 if(A.spyHit)kill(A.spyHit);
 const msg=dead.length?`💀 قُتل هذه الليلة: <b>${dead.map(x=>esc(x.name)).join('، ')}</b>`:'☀️ مرّت الليلة بسلام، لم يمت أحد.';
 const w=winner();if(w)return end(w,msg);
 $.innerHTML=`<span class="tag">صباح اليوم ${S.night}</span><div class="res">${msg}</div><p style="text-align:center">ناقشوا ثم صوّتوا لإقصاء المشتبه به.</p>${roster()}<div class="sp"></div><button class="main" onclick="vote()">بدء التصويت</button>`;
}
function winner(){
 const m=alive().filter(isM).length,o=alive().length-m;
 if(m===0)return 'citizens';if(m>=o)return 'mafia';return null;
}
function vote(){S.rv=0;startVote(null)}
function startVote(c){S.cand=c;S.vk=0;S.vo=alive().map(x=>S.p.indexOf(x));S.tl={};S.skipv=0;S.vv={};(c||S.vo).forEach(i=>S.tl[i]=0);vt(0)}
function vt(m){
 const i=S.vo[S.vk];if(i===undefined)return tally();
 const p=S.p[i];
 if(m===0){
  $.innerHTML=`<span class="tag">🗳️ ${S.rv?'إعادة التصويت':'التصويت'}</span><h2>مرّر الهاتف إلى</h2><div class="big">${esc(p.name)}</div><div class="sp"></div><button class="main" onclick="vt(1)">أنا ${esc(p.name)}، أصوّت</button>`;return;
 }
 S.sel=null;
 $.innerHTML=`<span class="tag">🗳️ ${esc(p.name)}</span><h2>من تريد إقصاءه؟</h2><div class="list" id="pk">${alive().filter(x=>x!==p&&(!S.cand||S.cand.includes(S.p.indexOf(x)))).map(x=>`<div class="pl" onclick="pick(${S.p.indexOf(x)},this)">${av(x.name)}${esc(x.name)}</div>`).join('')}</div><div class="sp"></div><button class="main" id="ok" disabled onclick="vd()">تأكيد صوتي</button><button class="sec" onclick="vd(1)">تخطي، لا أصوّت</button>`;
}
function vd(skip){const v=S.vo[S.vk];if(skip){S.skipv++;S.vv[v]=null}else{S.tl[S.sel]++;S.vv[v]=S.sel}S.vk++;vt(0)}
function tally(){
 const e=Object.entries(S.tl).sort((a,b)=>b[1]-a[1]),mx=e[0][1],top=e.filter(x=>x[1]===mx);
 const nm=j=>esc(S.p[j].name),who=j=>S.vo.filter(v=>S.vv[v]===+j).map(nm).join('، ');
 const sk=S.vo.filter(v=>S.vv[v]===null).map(nm).join('، ');
 const rows=`<div class="list">${e.filter(x=>x[1]>0).map(x=>`<div class="vr"><div class="vh">${av(S.p[x[0]].name)}${nm(x[0])}<b>${x[1]}</b></div><div class="bar"><i style="--w:${x[1]/mx*100}%"></i></div><div class="vw">صوّت عليه: ${who(x[0])}</div></div>`).join('')}</div>${sk?`<p>تخطّوا التصويت: ${sk}</p>`:''}`;
 const nx=`<button class="main" onclick="S.night++;nightIntro()">إلى الليل</button>`;
 if(mx===0||top.length>1){
  const tn=top.map(x=>nm(x[0])).join(' و');
  if(mx>0&&!S.rv){
   $.innerHTML=`<h2>نتيجة التصويت</h2>${rows}<div class="res">⚖️ تعادل بين ${tn}<br>سيُعاد التصويت بينهم مرة واحدة.</div><div class="sp"></div><button class="main" onclick="S.rv=1;startVote([${top.map(x=>x[0]).join(',')}])">إعادة التصويت</button>`;return;
  }
  const t=mx===0?'لا أحد صوّت، لا أحد يُقصى.':'تعادل مرة أخرى بين '+tn+'، لا أحد يُقصى.';
  $.innerHTML=`<h2>${S.rv?'نتيجة إعادة التصويت':'نتيجة التصويت'}</h2>${rows}<div class="res">⚖️ ${t}</div><div class="sp"></div>${nx}`;return;
 }
 const p=S.p[top[0][0]];p.alive=false;p.rev=true;
 const html=`<h2>نتيجة التصويت</h2>${rows}<div class="res">أُقصي <b>${esc(p.name)}</b><br>وكان ${R[p.role].e} ${R[p.role].n}</div>`;
 if(p.role==='jester')return end('jester',html);
 const w=winner();if(w)return end(w,html);
 $.innerHTML=`${html}<div class="sp"></div>${nx}`;
}
function end(w,html){
 const T={citizens:['citizen','🏆','فاز المواطنون'],mafia:['mafia','🔪','فازت المافيا'],jester:['jester','🤡','فاز المهرّج وحده']}[w];
 $.innerHTML=`${html||''}<div class="role ${T[0]}"><div class="e">${T[1]}</div><div class="n">${T[2]}</div></div><div class="list">${S.p.map(x=>`<div class="pl ${x.alive?'':'dead'}">${esc(x.name)}<span>${R[x.role].e} ${R[x.role].n}</span></div>`).join('')}</div><div class="sp"></div><button class="main" onclick="setup()">جولة جديدة</button>`;
}
let mt;function goMenu(){const b=document.getElementById('mn');if(b.dataset.s){clearTimeout(mt);b.dataset.s='';b.textContent='☰ القائمة';setup();return}b.dataset.s=1;b.textContent='اضغط للتأكيد، ستُلغى الجولة';mt=setTimeout(()=>{b.dataset.s='';b.textContent='☰ القائمة'},3000)}
let lastKey='';
const cf=()=>{document.getElementById('cf').innerHTML=Array.from({length:18},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*2.5}s;background:${['#d9a441','#d1344a','#5fc9a0','#efe6d2'][i%4]}"></i>`).join('')};
[['setup',''],['reveal','night'],['nightIntro','night'],['nt','night'],['morning','day'],['vote','day'],['vt','day'],['tally','day'],['end','end']].forEach(([n,c])=>{const f=window[n];window[n]=function(){document.body.dataset.ph=c;document.getElementById('cf').innerHTML='';const r=f.apply(this,arguments);if(c==='end')cf();const k=c+'|'+(($.querySelector('h1,h2,.big')||{}).textContent);if(k!==lastKey){lastKey=k;$.classList.remove('in');void $.offsetWidth;$.classList.add('in')}return r}});
setup();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
